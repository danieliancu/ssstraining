# Forge: paste into the site's Nginx config (replace the `location /` block Forge generates).
# Assumes the project at /home/forge/sstcourses.co.uk and gunicorn on a unix socket.

client_max_body_size 20m;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

location /static/ {
    alias /home/forge/sstcourses.co.uk/staticfiles/;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# Uploaded media keeps the WordPress URLs.
location /wp-content/uploads/ {
    alias /home/forge/sstcourses.co.uk/media/;
    expires 30d;
    access_log off;
}

location / {
    proxy_pass http://unix:/run/sst/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
