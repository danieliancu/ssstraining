<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><style id="sst-critical-hero-css">.custom-hero-wrapper{display:block;visibility:visible;opacity:1;min-height:500px;padding:100px 0 50px;text-align:left;position:relative}
		.hero-container-rel{position:relative;z-index:2}
		.hero-flex-wrapper{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:40px}
		.hero-text-content{flex:1 1 500px;max-width:600px}
		.hero-accreditation-logos{display:flex;align-items:center;gap:20px;max-width:480px;margin:0 0 28px}
		.hero-accreditation-logo{display:block;height:auto;object-fit:contain}
		.hero-accreditation-logo--iosh{width:300px;max-width:calc(100% - 116px)}
		.hero-accreditation-logo--nebosh{flex:0 0 auto;width:96px}
		.hero-headline{font-family:Poppins,Arial,sans-serif;font-size:clamp(38px,5vw,52px);font-weight:800;color:#0a1f44;line-height:1.1;padding:0;margin:0 0 20px}
		.hero-headline span{color:#007bff}
		.hero-subtitle{font-size:18px;color:#6c757d;line-height:1.7;margin:0 0 35px;max-width:500px}
		.hero-search-card{flex:1 1 400px;max-width:480px;background:#fff;padding:clamp(0px,5vw,40px);border-radius:20px;box-shadow:0 20px 40px rgba(10,31,68,.08)}
		.hero-submit-button{display:inline-block;background:#0066ff;color:#fff;border:0;border-radius:8px;padding:16px;text-align:center;font-weight:700;text-decoration:none}
		@media (max-width:767px){.custom-hero-wrapper{padding:50px 0 30px}.hero-flex-wrapper{gap:28px}.hero-accreditation-logos{gap:14px;margin-bottom:22px}.hero-accreditation-logo--iosh{max-width:calc(100% - 94px)}.hero-accreditation-logo--nebosh{width:80px}.hero-headline{font-size:38px}.hero-search-card{max-width:none;width:100%}}</style>
