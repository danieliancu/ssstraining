{# Port of template-parts/post/content-contact.php #}
<div class="contact-page left">
	<span class="title">Get in touch with us</span>
	 {{ page.body_html|safe }}

	<span class="title">Our contact details</span>
	<div class="contact-meta">
    	<div class="meta-inner">
        	<i class="fa fa-phone"></i>
            <a href="tel:{{ site_options.main_telephone_number }}">
            	{{ site_options.main_telephone_number }}
            </a>
        </div>
        <div class="meta-inner">
        	<i class="fa fa-envelope"></i>
            <a href="mailto:{{ site_options.main_email_address }}">
            	{{ site_options.main_email_address }}
            </a>
        </div>
    	 <div class="meta-inner contact-address">
         	<i class="fa fa-home"></i>
            <a href="{{ site_options.google_map_link }}" target="_blank" class="address">
            	{{ site_options.company_name }}
            	{{ site_options.address|wpautop }}
            </a>
         </div>
    </div>

    <div class="map-iframe-container">
<iframe src="{{ site_options.google_map_link }}" width="100%" height="100%" frameborder="0" style="border:0" allowfullscreen></iframe>
    </div>
</div>

<div class="contact-page right">
	{% contact_form 166 %}
</div>
