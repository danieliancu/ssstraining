{% comment %}Contact Form 7 markup for an apps.contact.forms.CF7Form; one line so the output matches WordPress byte for byte.{% endcomment %}<div class="wpcf7 no-js" id="{{ unit_tag }}" lang="en-GB" dir="ltr" data-wpcf7-id="{{ form.wp_id }}"><div class="screen-reader-response"><p role="status" aria-live="polite" aria-atomic="true"></p><ul></ul></div><form action="{{ action_path }}#{{ unit_tag }}" method="post" class="wpcf7-form init" aria-label="Contact form" novalidate="novalidate" data-status="init"><fieldset class="hidden-fields-container"><input type="hidden" name="_wpcf7" value="{{ form.wp_id }}" /><input type="hidden" name="_wpcf7_version" value="6.1.7" /><input type="hidden" name="_wpcf7_locale" value="en_GB" /><input type="hidden" name="_wpcf7_unit_tag" value="{{ unit_tag }}" /><input type="hidden" name="_wpcf7_container_post" value="{{ container_post }}" /><input type="hidden" name="_wpcf7_posted_data_hash" value="" /><input type="hidden" name="_wpcf7_recaptcha_response" value="" /></fieldset>{% for row in form.rows %}<div class="fields {{ row.wrapper }}"><p>{% if row.submit %}<input class="wpcf7-form-control wpcf7-submit has-spinner" type="submit" value="{{ form.submit_label }}" />{% else %}<label><br /> <b>{{ row.field.label }}</b><br /> <span class="wpcf7-form-control-wrap" data-name="{{ row.field.html_name }}">{{ row.field }}</span><br /> </label>{% endif %}</p></div>{% endfor %}<p style="display: none !important;" class="akismet-fields-container" data-prefix="_wpcf7_ak_"><label>&#916;<textarea name="_wpcf7_ak_hp_textarea" cols="45" rows="8" maxlength="100"></textarea></label><input type="hidden" id="ak_js_{{ ak_index }}" name="_wpcf7_ak_js" value="{{ ak_value }}"/><script defer src="{{ ak_script }}"></script> </p><div class="wpcf7-response-output" aria-hidden="true"></div></form></div>
