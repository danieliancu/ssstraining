{% load catalog_tags %}<li class="{% product_classes p forloop.counter0 %}">
	<a href="{{ site_url }}{{ p.get_absolute_url }}" class="woocommerce-LoopProduct-link woocommerce-loop-product__link">{% if with_image %}<img width="250" height="250" src="/wp-content/uploads/woocommerce-placeholder.webp" class="woocommerce-placeholder wp-post-image" alt="Placeholder" decoding="async" loading="lazy" srcset="/wp-content/uploads/woocommerce-placeholder.webp 1200w, /wp-content/uploads/woocommerce-placeholder-300x300.webp 300w, /wp-content/uploads/woocommerce-placeholder-1024x1024.webp 1024w, /wp-content/uploads/woocommerce-placeholder-150x150.webp 150w, /wp-content/uploads/woocommerce-placeholder-768x768.webp 768w, /wp-content/uploads/woocommerce-placeholder-125x125.webp 125w, /wp-content/uploads/woocommerce-placeholder-100x100.webp 100w, /wp-content/uploads/woocommerce-placeholder-200x200.webp 200w, /wp-content/uploads/woocommerce-placeholder-400x400.webp 400w, /wp-content/uploads/woocommerce-placeholder-600x600.webp 600w, /wp-content/uploads/woocommerce-placeholder-800x800.webp 800w, /wp-content/uploads/woocommerce-placeholder-1170x1170.webp 1170w" sizes="100vw" />{% endif %}<h2 class="woocommerce-loop-product__title">{{ p.title|texturize }}</h2>
	<span class="price">{{ p|wc_price_html }}</span>
</a><a href="{% add_to_cart_url request p %}" aria-describedby="woocommerce_loop_add_to_cart_link_describedby_{{ p.pk }}" data-quantity="1" class="button product_type_simple add_to_cart_button ajax_add_to_cart" data-product_id="{{ p.pk }}" data-product_sku="{{ p.sku }}" aria-label="Add to basket: &ldquo;{{ p.title }}&rdquo;" rel="nofollow" data-success_message="&ldquo;{{ p.title }}&rdquo; has been added to your basket" role="button">Add to basket</a>	<span id="woocommerce_loop_add_to_cart_link_describedby_{{ p.pk }}" class="screen-reader-text">
			</span>
</li>
