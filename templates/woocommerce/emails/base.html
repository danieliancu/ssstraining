<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>{{ options.site_name }}</title>
<style type="text/css">
#wrapper { background-color: #f7f7f7; margin: 0; padding: 70px 0; width: 100%; }
#template_container { background-color: #ffffff; border: 1px solid #dedede; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
#template_header { background-color: #0a1f44; color: #ffffff; border-radius: 3px 3px 0 0; }
#template_header h1 { color: #ffffff; font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif; font-size: 30px; font-weight: 300; line-height: 150%; margin: 0; text-align: left; }
#header_wrapper { padding: 36px 48px; display: block; }
#body_content { background-color: #ffffff; }
#body_content_inner { color: #636363; font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif; font-size: 14px; line-height: 150%; text-align: left; }
#body_content td { padding: 48px 48px 32px; }
h2 { color: #0a1f44; display: block; font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif; font-size: 18px; font-weight: bold; line-height: 130%; margin: 0 0 18px; text-align: left; }
.td { color: #636363; border: 1px solid #e5e5e5; vertical-align: middle; padding: 12px; text-align: left; }
.address { padding: 12px; color: #636363; border: 1px solid #e5e5e5; }
a { color: #57b8ff; font-weight: normal; text-decoration: underline; }
#template_footer td { padding: 0; border-radius: 6px; }
#credit { border: 0; color: #8a8a8a; font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif; font-size: 12px; line-height: 150%; text-align: center; padding: 24px 0; }
</style>
</head>
<body leftmargin="0" marginwidth="0" topmargin="0" marginheight="0" offset="0">
<table width="100%" id="outer_wrapper"><tr><td></td><td width="600">
<div id="wrapper" dir="ltr">
<table border="0" cellpadding="0" cellspacing="0" height="100%" width="100%"><tr><td align="center" valign="top">
<table border="0" cellpadding="0" cellspacing="0" width="100%" id="template_container">
<tr><td align="center" valign="top">
<table border="0" cellpadding="0" cellspacing="0" width="100%" id="template_header"><tr><td id="header_wrapper"><h1>{{ email_heading }}</h1></td></tr></table>
</td></tr>
<tr><td align="center" valign="top">
<table border="0" cellpadding="0" cellspacing="0" width="100%" id="template_body"><tr><td valign="top" id="body_content">
<table border="0" cellpadding="20" cellspacing="0" width="100%"><tr><td valign="top"><div id="body_content_inner">
{% block body %}{% endblock %}
</div></td></tr></table>
</td></tr></table>
</td></tr>
</table>
</td></tr>
<tr><td align="center" valign="top">
<table border="0" cellpadding="10" cellspacing="0" width="100%" id="template_footer"><tr><td valign="top"><table border="0" cellpadding="10" cellspacing="0" width="100%"><tr><td colspan="2" valign="middle" id="credit">{{ options.order_email_footer|default:options.site_name|linebreaksbr }}</td></tr></table></td></tr></table>
</td></tr>
</table>
</div>
</td><td></td></tr></table>
</body>
</html>
