[pytest]
DJANGO_SETTINGS_MODULE = sst.settings.dev
python_files = tests.py test_*.py *_tests.py
# The 'wordpress' alias mirrors 'default' under test (sst/settings/base.py), so tests never
# touch the WordPress database. --reuse-db keeps the MySQL test database between runs.
addopts = --reuse-db -p no:cacheprovider
testpaths = apps
